<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="walletFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D9E75"/>
      <stop offset="100%" stop-color="#0F6E56"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#walletFill)"/>

  <!-- Wallet body -->
  <rect x="86" y="196" width="340" height="222" rx="28" fill="#E1F5EE"/>
  <rect x="86" y="196" width="340" height="58" rx="28" fill="#9FE1CB"/>
  <rect x="86" y="226" width="340" height="28" fill="#9FE1CB"/>

  <!-- Wallet flap -->
  <rect x="106" y="150" width="256" height="68" rx="18" fill="#085041"/>

  <!-- Coin -->
  <circle cx="326" cy="307" r="44" fill="#FAC775"/>
  <circle cx="326" cy="307" r="44" fill="none" stroke="#854F0B" stroke-width="4"/>
  <text x="326" y="309" text-anchor="middle" dominant-baseline="central"
        font-size="44" font-weight="700" fill="#633806"
        font-family="Arial, Helvetica, sans-serif">$</text>

  <!-- Small accent dots -->
  <circle cx="150" cy="440" r="14" fill="#FAC775"/>
  <circle cx="420" cy="150" r="12" fill="#F0997B"/>
  <circle cx="110" cy="120" r="10" fill="#5DCAA5"/>
</svg>
