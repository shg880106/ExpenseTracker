<p-toolbar styleClass="app-toolbar">
  <div class="p-toolbar-group-start nav">
    <a routerLink="/dashboard" class="brand">
      <img src="expense-tracker-icon.svg" alt="ExpenseTracker" class="brand-icon">
      <span>ExpenseTracker</span>
    </a>
    <a routerLink="/dashboard" routerLinkActive="active-link">Dashboard</a>
    <a routerLink="/categories" routerLinkActive="active-link">Categories</a>
  </div>
  <div class="p-toolbar-group-end user">
    @if (currentUser(); as user) {
      <span class="user-name">{{ user.name }}</span>
    }
    <p-button label="Log out" icon="pi pi-sign-out" [text]="true" severity="secondary" (onClick)="logout()" />
  </div>
</p-toolbar>

<main class="app-content">
  <router-outlet />
</main>
